name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Unpack project archive
        run: for z in *.zip; do if [ -f "$z" ]; then unzip -oq "$z"; fi; done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: bash gradlew assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrollDroid.apk
          gh release create "build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" TrollDroid.apk \
            --title "Build $GITHUB_RUN_NUMBER" --notes "Debug APK"
